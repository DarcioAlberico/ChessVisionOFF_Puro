[project]
name = "chessvisionoff-puro"
version = "0.1.0"
description = "Extrai diagramas de xadrez de PDFs, converte para FEN e treina o modelo de forma incremental"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "chess>=1.11",
    "streamlit>=1.34.0",
    # Tema da janela (S-53). Mesma API de widget do `ttk`, `Treeview` intacto -- e o
    # `ui/theme.py` degrada para o `ttk` puro se ela faltar, porque aparencia nao pode ser
    # motivo de a ferramenta nao abrir.
    "ttkbootstrap>=2.0",
    # `pythonnet` e `pywebview` moravam aqui, so-Windows, pelo modo "Leitura" via WebView2.
    # Sairam com ele na S-69, e com elas a unica dependencia de plataforma do projeto.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]
# Backend alternativo de inferencia em CPU (S-30). Opcional de proposito: o pipeline
# funciona sem ele, e `cvoff-export-onnx` avisa se faltar.
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
# Motor de OCR para os 7 livros sem camada de texto (S-42). Opcional pelo mesmo motivo do
# `onnx`: 20 dos 27 livros do acervo tem camada de texto, e para eles isto e custo puro.
# RapidOCR e o padrao porque os modelos vem no wheel -- nada e baixado na primeira
# execucao, o que mantem a promessa do README de que nada sai da maquina no uso padrao.
ocr = [
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.18",
]
# Empacotamento Windows (S-55). Extra separado porque so quem gera o .zip precisa dele --
# e ele so e usado por `packaging/cvoff.spec`, nunca importado pelo codigo.
packaging = [
    "pyinstaller>=6.6",
]
# Segundo leitor local, o botao "2a opiniao" (S-66). Sao as dependencias que o clone de
# tsoj/Chess_diagram_to_FEN importa; o clone e os 232,8 MiB de peso ficam fora do
# repositorio, apontados por `local_reader.path` nas preferencias.
#
# Opcional pelo mesmo motivo do `ocr`: quem ja tem dado do proprio acervo nao precisa de
# segunda opiniao, e `tsoj_reader` avisa em pt-BR exatamente o que falta quando falta.
second-opinion = [
    "scikit-image>=0.24",
    "matplotlib>=3.8",
    "pyfastnoiselite>=0.0.7",
    "cairosvg>=2.7",
    "pyffish>=0.0.89",
    "tqdm>=4.66",
]

[project.scripts]
cvoff-train = "chess_diagram_ocr.cli.train:main"
cvoff-infer = "chess_diagram_ocr.cli.infer:main"
cvoff-export = "chess_diagram_ocr.cli.export_pgn:main"
cvoff-batch = "chess_diagram_ocr.cli.batch:main"
cvoff-audit = "chess_diagram_ocr.cli.audit:main"
cvoff-eval = "chess_diagram_ocr.cli.evaluate:main"
cvoff-field = "chess_diagram_ocr.cli.field:main"
cvoff-migrate-labels = "chess_diagram_ocr.cli.migrate_labels:main"
cvoff-provenance = "chess_diagram_ocr.cli.provenance:main"
cvoff-review = "chess_diagram_ocr.cli.review:main"
cvoff-sides = "chess_diagram_ocr.cli.sides:main"
cvoff-experiment = "chess_diagram_ocr.cli.experiment:main"
cvoff-export-onnx = "chess_diagram_ocr.cli.export_onnx:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# S-37: a suite roda num checkout sem instalacao editavel. Nao substitui `uv sync` -- o
# `app_tkinter.py` e os `cvoff-*` continuam dependendo dela, e `tests/test_environment.py`
# e quem confere isso. Aqui o que se garante e que um diretorio movido nao desligue 611
# testes em silencio, que foi o estado encontrado na analise da Fase 7.
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
]
ignore = [
    "E501",  # comprimento de linha ja e controlado por line-length
    "B008",  # chamada em argumento default: padrao aceito nos CLIs (Path(...))
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
