[project]
name = "chessvisionoff-puro"
version = "0.1.0"
description = "Extrai diagramas de xadrez de PDFs, converte para FEN e treina o modelo de forma incremental"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "chess>=1.11",
    "streamlit>=1.34.0",
    # Modo "Leitura" do PDF via Microsoft Edge WebView2: somente Windows.
    "pythonnet>=3.0.5 ; sys_platform == 'win32'",
    "pywebview>=6.1 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]

[project.scripts]
cvoff-train = "chess_diagram_ocr.cli.train:main"
cvoff-infer = "chess_diagram_ocr.cli.infer:main"
cvoff-export = "chess_diagram_ocr.cli.export_pgn:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
]
ignore = [
    "E501",  # comprimento de linha ja e controlado por line-length
    "B008",  # chamada em argumento default: padrao aceito nos CLIs (Path(...))
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
