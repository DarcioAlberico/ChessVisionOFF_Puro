[project]
name = "chessvisionoff-puro"
version = "0.1.0"
description = "Extrai diagramas de xadrez de PDFs, converte para FEN e treina o modelo de forma incremental"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "chess>=1.11",
    # Tema da janela (S-53). Mesma API de widget do `ttk`, `Treeview` intacto -- e o
    # `ui/theme.py` degrada para o `ttk` puro se ela faltar, porque aparencia nao pode ser
    # motivo de a ferramenta nao abrir.
    "ttkbootstrap>=2.0",
    # `pythonnet` e `pywebview` moravam aqui, so-Windows, pelo modo "Leitura" via WebView2.
    # Sairam com ele na S-69, e com elas a unica dependencia de plataforma do projeto.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # `pandas` era dependencia **obrigatoria** e nao e importado por modulo de producao nenhum
    # (S-386): quem o importa sao quatro arquivos de teste, que o usam como segunda regua para
    # o CSV de rotulos -- "o que sai daqui e byte a byte igual ao que o pandas escreveria".
    # Como obrigatorio ele viajava dentro do `.exe`, e o bundle e o lugar onde peso custa.
    "pandas>=2.2.0",
    "pandas-stubs",
]
# Backend alternativo de inferencia em CPU (S-30). Opcional de proposito: o pipeline
# funciona sem ele, e `cvoff-export-onnx` avisa se faltar.
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
# Motor de OCR para os 7 livros sem camada de texto (S-42). Opcional pelo mesmo motivo do
# `onnx`: 20 dos 27 livros do acervo tem camada de texto, e para eles isto e custo puro.
# RapidOCR e o padrao porque os modelos vem no wheel -- nada e baixado na primeira
# execucao, o que mantem a promessa do README de que nada sai da maquina no uso padrao.
ocr = [
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.18",
]
# A demonstracao Streamlit (S-54). Era dependencia **obrigatoria**, ao lado de `torch` e
# `opencv`, para um exemplo que a propria S-54 aposentou -- nada em `src/` o importa. Ele
# arrasta `pyarrow`, e juntos sao 115,4 MiB, 16,6% do bundle que o usuario baixa e nunca
# executa (S-137). Vira extra pela mesma regra dos outros quatro: quem quer a demonstracao
# pede a demonstracao.
demo = [
    "streamlit>=1.34.0",
]
# Empacotamento Windows (S-55). Extra separado porque so quem gera o .zip precisa dele --
# e ele so e usado por `packaging/cvoff.spec`, nunca importado pelo codigo.
packaging = [
    "pyinstaller>=6.6",
]
# Segundo leitor local, o botao "2a opiniao" (S-66). Sao as dependencias que o clone de
# tsoj/Chess_diagram_to_FEN importa; o clone e os 232,8 MiB de peso ficam fora do
# repositorio, apontados por `local_reader.path` nas preferencias.
#
# Opcional pelo mesmo motivo do `ocr`: quem ja tem dado do proprio acervo nao precisa de
# segunda opiniao, e `tsoj_reader` avisa em pt-BR exatamente o que falta quando falta.
second-opinion = [
    "scikit-image>=0.24",
    "matplotlib>=3.8",
    "pyfastnoiselite>=0.0.7",
    "cairosvg>=2.7",
    "pyffish>=0.0.89",
    "tqdm>=4.66",
]

[project.scripts]
cvoff-train = "chess_diagram_ocr.cli.train:main"
cvoff-infer = "chess_diagram_ocr.cli.infer:main"
cvoff-export = "chess_diagram_ocr.cli.export_pgn:main"
cvoff-batch = "chess_diagram_ocr.cli.batch:main"
cvoff-audit = "chess_diagram_ocr.cli.audit:main"
cvoff-census = "chess_diagram_ocr.cli.census:main"
cvoff-eval = "chess_diagram_ocr.cli.evaluate:main"
cvoff-field = "chess_diagram_ocr.cli.field:main"
cvoff-migrate-labels = "chess_diagram_ocr.cli.migrate_labels:main"
cvoff-provenance = "chess_diagram_ocr.cli.provenance:main"
cvoff-games = "chess_diagram_ocr.cli.games:main"
cvoff-review = "chess_diagram_ocr.cli.review:main"
cvoff-sides = "chess_diagram_ocr.cli.sides:main"
cvoff-experiment = "chess_diagram_ocr.cli.experiment:main"
cvoff-gallery = "chess_diagram_ocr.cli.gallery:main"
cvoff-scan = "chess_diagram_ocr.cli.scan:main"
cvoff-export-onnx = "chess_diagram_ocr.cli.export_onnx:main"
# Diz quais itens do plano de reconhecimento de texto (S-178 a S-216) ja existem no disco.
# Olha o disco, nao o documento: `tests/test_text_status.py` e quem compara os dois.
cvoff-texto-status = "chess_diagram_ocr.cli.text_status:main"
# O placar da S-183: a mesma faixa de legenda lida pela camada de texto, pelo RapidOCR e
# pelo classificador de glifo. E o item que decide se a Fase 26 acontece.
cvoff-texto-placar = "chess_diagram_ocr.cli.texto_placar:main"
# A janela que transcreve as 123 faixas da S-183 com o PNG exportado ao lado (Etapa 7 do
# PLANO_OCR_TEXTO). Nao tem, e nao vai ter, um botao de preencher com OCR: a referencia
# vinda de um motor faria o placar acima medir o motor contra ele mesmo.
cvoff-texto-transcrever = "chess_diagram_ocr.cli.texto_transcrever:main"
# A regua da ordem de leitura (S-194): mede a nossa contra a da camada de texto do proprio
# PDF. Independente da nossa medicao -- mas em parte do acervo a camada e de OCR, e nao da
# diagramacao, e ali ela nao arbitra grade de exercicio (S-216).
cvoff-texto-ordem = "chess_diagram_ocr.cli.texto_ordem:main"
# O treino do classificador de caracteres (S-204): varre training_data/, parte por grupo de
# copia exata, treina, calibra na validacao e grava o par pinado que text/modelo.py exige.
# O inventario da base de caractere (S-200): varre training_data/, grava o manifesto e o
# relatorio de procedencia, e nao escreve nada dentro da pasta que inventaria.
cvoff-texto-inventario = "chess_diagram_ocr.cli.texto_inventario:main"
# O inventario do EDITOR (S-256): o outro esta acima e conta recorte de caractere.
cvoff-editor-inventario = "chess_diagram_ocr.cli.editor_inventario:main"
cvoff-texto-train = "chess_diagram_ocr.cli.texto_train:main"
# A mesma imagem arquivada sob dois caracteres (S-202): acha por hash, mostra os glifos em
# disputa para alguem julgar, e move o rotulo perdedor para quarentena -- nunca apaga.
cvoff-texto-conflitos = "chess_diagram_ocr.cli.texto_conflitos:main"
# A grade de variantes do treino de caractere (S-204): roda cada braco no val com o mesmo
# orcamento, e toca o teste uma vez so, com a vencedora.
cvoff-texto-variantes = "chess_diagram_ocr.cli.texto_variantes:main"
# A direcao em que cada livro numera a grade de exercicios (S-216), medida contra o numero
# impresso na pagina -- que e a unica referencia que a camada de OCR nao contamina.
cvoff-texto-grade = "chess_diagram_ocr.cli.texto_grade:main"
# A tabela dos quatro angulos do texto girado (S-197): a linha e girada por transposicao, e o
# relatorio traz duas reguas -- o argmax da media (o classificador) e o que decidir_angulo faz.
cvoff-texto-vertical = "chess_diagram_ocr.cli.texto_vertical:main"
# O ganho do corte de linha e do descarte de fragmento (S-198), medido em faixa dilatada em
# 2 pt -- que e onde o defeito aparece, e o numero da S-185 com que se compara.
cvoff-texto-duas-linhas = "chess_diagram_ocr.cli.texto_duas_linhas:main"
# O separador de glifo colado (S-186), medido nos tres modos antes de ser ligado: as classes de
# ligadura ja absorvem parte do problema, e o padrao sai desta tabela e nao de heranca.
cvoff-texto-colados = "chess_diagram_ocr.cli.texto_colados:main"
# O ganho de ler a linha em vez do caractere (S-188/S-189), com o leitor que o roadmap
# recomenda. O numero de 91,2% e do acervo de la e nao atravessa a troca de motor sem medicao.
cvoff-texto-linha = "chess_diagram_ocr.cli.texto_linha:main"
# As duas reguas lado a lado (S-206): a acuracia do classificador sobre recorte ja segmentado e
# o CER da pagina inteira. O comando recusa publicar so a primeira, que e a lisonjeira.
cvoff-texto-placar-final = "chess_diagram_ocr.cli.texto_placar_final:main"

# S-211: a pagina inteira lida como texto, e nao so a faixa de legenda.
cvoff-texto-pagina = "chess_diagram_ocr.cli.texto_pagina:main"

# S-239: o que a mao corrigiu nos .cvtxt do editor, agrupado por troca. Nao rotula nada -- quem
# transforma correcao em rotulo e a S-212, que tem a fila e o criterio.
cvoff-texto-correcoes = "chess_diagram_ocr.cli.texto_correcoes:main"

# Empacota uma pasta de listas de palavras em assets/lexico/. Trocar a lista do dicionario nao
# e mexer em codigo -- e o que a S-209 pede das duas listas.
cvoff-texto-lexico = "chess_diagram_ocr.cli.texto_lexico:main"

# S-215: quanto o texto soma a varredura, etapa a etapa, com as duas pontas da divisao medidas na
# mesma corrida. `--baseline` reprova quando o custo por pagina piora -- regressao de desempenho
# e regressao, e e a trava do `cvoff-census --fail-on-loss`.
cvoff-texto-custo = "chess_diagram_ocr.cli.texto_custo:main"

# S-213: a precisao e a cobertura de "aplicar a todos os semelhantes", medidas nesta base. O
# criterio e a IMAGEM, e nao o caractere lido -- casar por caractere traria junto os legitimos.
cvoff-texto-semelhanca = "chess_diagram_ocr.cli.texto_semelhanca:main"

# S-207: quantos diagramas deixam de sair `default` com o classificador de casa lendo a legenda.
# Mede os dois lados na mesma corrida -- so a camada de texto, e a camada mais o glifo.
cvoff-texto-lado = "chess_diagram_ocr.cli.texto_lado:main"

# S-210: o livro com a camada de texto invisivel do que o motor leu. A pagina nao muda um pixel --
# `render_mode=3` --, e a camada e por LINHA para o retangulo da busca cobrir a palavra.
cvoff-texto-pesquisavel = "chess_diagram_ocr.cli.texto_pesquisavel:main"

# S-257/S-258: a referencia de paragrafo pelo sinal do fim de linha, e a varredura dos dois cortes.
# Versiona o instrumento -- a medicao da S-257 saiu de um script no diretorio da sessao.
cvoff-texto-paragrafo = "chess_diagram_ocr.cli.texto_paragrafo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# S-37: a suite roda num checkout sem instalacao editavel. Nao substitui `uv sync` -- o
# `app_tkinter.py` e os `cvoff-*` continuam dependendo dela, e `tests/test_environment.py`
# e quem confere isso. Aqui o que se garante e que um diretorio movido nao desligue 611
# testes em silencio, que foi o estado encontrado na analise da Fase 7.
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
# O `.spec` do PyInstaller e Python, e ate a S-391 nenhuma das duas guardas o via: `ruff` e
# `mypy` olham `.py`, o arquivo tem `# noqa: F821` espalhado -- que so faz sentido se alguem
# estiver lintando -- e o comentario do `[tool.mypy]` dizia que `packaging/` entrava. O `.spec`
# decide o que o usuario recebe; ficar fora das guardas e o que deixou 95 MB entrarem sem
# ninguem declarar (S-387).
extend-include = ["*.spec"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
]
ignore = [
    "E501",  # comprimento de linha ja e controlado por line-length
    "B008",  # chamada em argumento default: padrao aceito nos CLIs (Path(...))
]

[tool.mypy]
python_version = "3.10"
# `app_tkinter.py` ficava de fora, e e onde tudo e montado -- 1.302 linhas em que o
# CONTRIBUTING registra que um `AttributeError` sobreviveu a 509 testes verdes (S-137). Ele
# passa limpo; o que faltava era a guarda. `packaging/` entra pela mesma razao: o `--selftest`
# decide o que o usuario recebe.
#
# **O `.spec` fica de fora do mypy, e a razao e do formato (S-391).** O mypy so le `.py`, e o
# arquivo nao pode virar um: o PyInstaller o executa injetando `SPECPATH`, `Analysis`, `EXE` e
# `COLLECT` como globais -- nomes que nao existem em import nenhum, e que o verificador
# acusaria um por um. Quem o cobre e o `ruff`, pelo `extend-include` acima, que e o que valida
# o que da para validar sem executar o PyInstaller.
files = ["src", "app_tkinter.py", "packaging"]
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
